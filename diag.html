<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>搜索诊断 · guang's CTF Notes</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 18px 16px 60px;
    background: #0d1117; color: #d6dde6;
    font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { color: #7d8b9c; font-size: 13px; margin-bottom: 18px; }
  .row {
    padding: 10px 12px; margin-bottom: 8px; border-radius: 10px;
    background: #161b22; border: 1px solid #232c3a;
  }
  .k { font-size: 12px; color: #7d8b9c; letter-spacing: .3px; }
  .v { font-family: ui-monospace, Consolas, monospace; font-size: 14px;
       word-break: break-all; margin-top: 2px; }
  .ok   { color: #3fb950; }
  .bad  { color: #f85149; }
  .warn { color: #d29922; }
  button {
    margin-top: 16px; padding: 12px 18px; font-size: 15px;
    border: 0; border-radius: 10px; background: #238636; color: #fff;
  }
  pre { white-space: pre-wrap; word-break: break-all; background: #0b0f14;
        border: 1px solid #232c3a; border-radius: 10px; padding: 12px; font-size: 13px; }
</style>
</head>
<body>
<h1>搜索诊断</h1>
<div class="sub">在手机上打开这一页，跑完截图发回来。全部在本机执行，不上传任何东西。</div>

<div id="out"></div>
<button id="copy">复制全部结果</button>
<pre id="raw" hidden></pre>

<script>
(function () {
  var out = document.getElementById('out');
  var lines = [];

  function box(key, value, cls) {
    var d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = '<div class="k"></div><div class="v"></div>';
    d.querySelector('.k').textContent = key;
    var v = d.querySelector('.v');
    v.textContent = value;
    if (cls) v.className = 'v ' + cls;
    out.appendChild(d);
    lines.push(key + ': ' + value);
    return d;
  }
  function set(d, value, cls) {
    var v = d.querySelector('.v');
    v.textContent = value;
    v.className = 'v' + (cls ? ' ' + cls : '');
    lines.push(d.querySelector('.k').textContent + ': ' + value);
  }

  // ---- 1. 环境 ----
  box('User-Agent', navigator.userAgent);
  box('屏幕 / 视口', screen.width + '×' + screen.height + ' / ' + innerWidth + '×' + innerHeight);
  var m = navigator.userAgent.match(/OS (\d+)[_.](\d+)/);
  box('UA 里的系统版本', m ? m[1] + '.' + m[2] : '解析不到（非 iOS）');

  // ---- 2. 能力 ----
  var caps = [
    ['Worker', typeof Worker === 'function'],
    ['fetch', typeof fetch === 'function'],
    ['URL.createObjectURL', typeof URL === 'function' && typeof URL.createObjectURL === 'function'],
    ['Blob', typeof Blob === 'function'],
    ['可选链 ?.', (function () { try { return eval('({})?.a === undefined'); } catch (e) { return false; } })()],
    ['空值合并 ??', (function () { try { return eval('(null ?? 1) === 1'); } catch (e) { return false; } })()]
  ];
  box('语言能力检测',
      caps.map(function (c) { return (c[1] ? '✓ ' : '✗ ') + c[0]; }).join('   '),
      caps.every(function (c) { return c[1]; }) ? 'ok' : 'warn');

  // ---- 3. 分词正则 ----
  try {
    var sep = new RegExp('[\\s\\u200b\\-]+|(?=[\\u4e00-\\u9fff])');
    var parts = '文件包含漏洞的绕过'.split(sep).filter(Boolean);
    box('分词正则', parts.length > 1
      ? '可用 → ' + JSON.stringify(parts.slice(0, 6)) + '…'
      : '不可用 → 整句没被切开', parts.length > 1 ? 'ok' : 'bad');
  } catch (e) {
    box('分词正则', '编译失败：' + e.message, 'bad');
  }

  // ---- 4. 最简 Worker（Blob，跟主题无关）----
  var blobBox = box('Blob Worker（最简探针）', '测试中…');
  (function () {
    try {
      var src = 'self.onmessage=function(e){self.postMessage("pong:"+e.data)}';
      var url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
      var w = new Worker(url);
      var done = false;
      w.onmessage = function (e) {
        done = true;
        set(blobBox, '可用 → ' + e.data + '（这台设备能跑 Worker）', 'ok');
        try { w.terminate(); URL.revokeObjectURL(url); } catch (x) {}
      };
      w.onerror = function (evt) {
        done = true;
        set(blobBox, '不可用 → ' + (evt.message || '无消息'), 'bad');
      };
      w.postMessage('ping');
      setTimeout(function () {
        if (!done) set(blobBox, '3 秒无回音（既没成功也没报错，像被静默拦截）', 'warn');
      }, 3000);
    } catch (e) {
      set(blobBox, '创建就失败：' + e.message, 'bad');
    }
  })();

  // ---- 5. 主题真正的 search worker：先读真实路径，再测 ----
  var workerBox = box('主题 search worker', '等待解析真实路径…');
  fetch('index.html', { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var mm = html.match(/"search"\s*:\s*"([^"]+)"/);
      if (!mm) { set(workerBox, '首页 __config 里找不到 search 字段', 'bad'); return; }
      var path = mm[1];
      return fetch(path, { cache: 'no-store' }).then(function (r) {
        set(workerBox, '路径 ' + path + ' → HTTP ' + r.status, r.ok ? 'ok' : 'bad');
        if (!r.ok) return;
        var wd = box('主题 worker 运行', '启动中…');
        try {
          var w = new Worker(path);
          var errShown = false;
          function onErr(evt) {
            if (errShown) return;
            errShown = true;
            var bits = [];
            if (evt && evt.message) bits.push('message=' + evt.message);
            if (evt && evt.filename) bits.push('file=' + evt.filename);
            if (evt && evt.lineno) bits.push('line=' + evt.lineno + ':' + (evt.colno || 0));
            if (evt && evt.error && evt.error.stack) bits.push('stack=' + String(evt.error.stack).slice(0, 200));
            if (!bits.length) bits.push('error 事件里没有任何细节');
            set(wd, bits.join(' · '), 'bad');
            try { w.terminate(); } catch (x) {}
          }
          w.addEventListener('error', onErr);
          w.onerror = onErr;
          w.addEventListener('message', function (evt) {
            if (errShown) return;
            var d = evt.data;
            var n = d && d.type === 'result' && d.data ? (d.data.length || 0) : 0;
            set(wd, '有回音 → type=' + (d && d.type) + '，结果 ' + n + ' 条', 'ok');
          });
          setTimeout(function () {
            try {
              w.postMessage({
                type: 'search',
                data: { query: 'php', limit: 3, suggest: true, section: '', options: '', empty: 'x' }
              });
            } catch (e) {}
          }, 400);
          setTimeout(function () {
            if (!errShown && wd.querySelector('.v').textContent === '启动中…') {
              set(wd, '2.5 秒内既无报错也无回音', 'warn');
            }
            try { w.terminate(); } catch (x) {}
          }, 2500);
        } catch (e) {
          set(wd, '创建失败：' + e.message, 'bad');
        }
      });
    })
    .catch(function (e) { set(workerBox, '读取首页失败：' + e.message, 'bad'); });

  // ---- 6. 索引 ----
  var idxBox = box('搜索索引', '请求中…');
  var t0 = Date.now();
  fetch('search/search_index.json', { cache: 'no-store' })
    .then(function (r) {
      var ms1 = Date.now() - t0;
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text().then(function (txt) {
        var t1 = Date.now();
        var json = JSON.parse(txt);
        var t2 = Date.now();
        set(idxBox, (txt.length / 1024).toFixed(0) + ' KB · 下载 ' + ms1 + ' ms · 解析 ' + (t2 - t1) +
          ' ms · ' + (json.docs || []).length + ' 条 · separator ' +
          (json.config && json.config.separator ? '有' : '没有'), 'ok');
      });
    })
    .catch(function (e) { set(idxBox, '失败：' + e.message, 'bad'); });

  // ---- 7. 兜底 ----
  window.addEventListener('error', function (e) {
    box('页面脚本报错', (e.message || '') + ' @' + (e.lineno || ''), 'bad');
  });
  window.addEventListener('unhandledrejection', function (e) {
    box('未处理的 Promise 拒绝', String(e.reason), 'bad');
  });

  // ---- 8. 复制 ----
  document.getElementById('copy').onclick = function () {
    var text = lines.join('\n');
    var btn = this;
    navigator.clipboard.writeText(text).then(function () {
      btn.textContent = '已复制';
    }, function () {
      var pre = document.getElementById('raw');
      pre.hidden = false;
      pre.textContent = text;
    });
  };
})();
</script>
</body>
</html>
