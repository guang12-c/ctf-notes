site_name: "guang's CTF Notes"
site_description: Web 安全知识点整理 + 靶场 Writeup
site_author: guang
site_url: !ENV [SITE_URL, "https://guang12-c.github.io/ctf-notes/"]

repo_name: "guang12-c/ctf-notes"
repo_url: "https://github.com/guang12-c/ctf-notes"
edit_uri: "edit/main/docs/"

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  icon:
    logo: material/shield-search
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - zh
        - en
      # 中文没有空格，lunr 默认只按 [\s-]+ 切，一整段中文会变成单个超长 token，
      # 搜「文件包含」永远匹配不上。这里改成「每个汉字前切一刀」+ 原有的空格/横线切分，
      # 索引和查询都会落到单字 token 上，lunr 再按 AND 匹配，中文才搜得出来。
      separator: '[\s\u200b\-]+|(?=[\u4e00-\u9fff])'
  - blog:
      blog_dir: blog
      post_dir: "{blog}/posts"
      post_date_format: yyyy-MM-dd
      post_url_format: "{slug}"
      post_excerpt: optional
      archive: true
      categories: true
      authors: false
      pagination_per_page: 10

markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols

nav:
  - 首页: index.md
  - 知识点:
      - knowledge/index.md
      - SQL 注入:
          - knowledge/sql/index.md
          - 原理与识别: knowledge/sql/01-原理与识别.md
          - payload 速查: knowledge/sql/02-payload速查.md
          - 卡点复盘: knowledge/sql/03-卡点复盘.md
          - 四个 lab 通关记录: knowledge/sql/04-四个lab通关记录.md
          - 盲注脚本: knowledge/sql/05-盲注脚本.md
          - OOB 带外注入: knowledge/sql/06-OOB带外注入.md
          - 报错注入专题: knowledge/sql/07-报错注入专题.md
          - 逐行讲解(盲注脚本): knowledge/sql/blind_sqli_error_逐行讲解.md
      - 文件上传:
          - knowledge/upload/index.md
          - 文件上传专题: knowledge/upload/文件上传专题.md
      - RCE:
          - knowledge/rce/index.md
          - RCE 专题: knowledge/rce/RCE专题.md
      - 路径遍历:
          - knowledge/traversal/index.md
          - 路径遍历专题: knowledge/traversal/路径遍历专题.md
      - 文件包含:
          - knowledge/inclusion/index.md
          - 文件包含专题: knowledge/inclusion/文件包含专题.md
      - 反序列化:
          - knowledge/deserialization/index.md
          - 反序列化专题: knowledge/deserialization/反序列化专题.md
      - Web 通用:
          - knowledge/web/index.md
          - CTF-Web 学习笔记: knowledge/web/CTF-Web学习笔记.md
          - 工具命令速查: knowledge/web/工具命令速查.md
      - 代码审计:
          - knowledge/audit/index.md
          - 代码审计入门: knowledge/audit/代码审计入门-PHP与Java.md
  - WP 博客:
      - blog/index.md
  - 工具字典:
      - files/index.md

copyright: 仅用于个人学习与授权测试记录

extra_css:
  - assets/css/bg-video.css
  - assets/css/blog-hover.css

extra_javascript:
  # 诊断用：只在 URL 带 ?diag=1 时生效，正常访问什么都不做
  - assets/js/error-trap.js
  - assets/js/bg-video.js
  - assets/js/blog-hover.js
